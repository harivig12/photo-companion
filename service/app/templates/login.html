<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Photos companion</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="login" id="main">
  <div class="panel">
    <h1>Photos companion</h1>
    <p class="muted">Works with Immich at {{ immich_url }}</p>
    <form method="post" action="/login" class="stack">
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
               {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
        {% if error %}<p class="err" id="login-error" role="alert">{{ error }}</p>{% endif %}
      </div>
      <button class="btn" type="submit">Sign in</button>
      <p class="faint">Forgot it? Run <code>docker compose exec photos python -m app.reset_password</code>.</p>
    </form>
  </div>
</main>
</body>
</html>
